spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/fraudguard
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=60
fraud.high-amount-threshold=50000
fraud.velocity-max-per-minute=5
fraud.review-threshold=0.40
fraud.block-threshold=0.80
ml.url=http://localhost:8000
ml.base-url=http://127.0.0.1:8000
ml.connect-timeout-ms=200
ml.read-timeout-ms=500
ml.failure-threshold=3
ml.cooldown-seconds=30